spring:
  application:
    name: roost

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    # Assembled from env with local-dev defaults, so a managed Postgres (Render,
    # etc.) wires in by setting DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
    # docker-compose still overrides the whole URL via SPRING_DATASOURCE_URL.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:roost}
    username: ${DB_USER:roost}
    password: ${DB_PASSWORD:roost}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      # Env-driven with local defaults; a managed Redis/Key Value can instead be
      # wired with SPRING_DATA_REDIS_URL (redis://…), which takes precedence.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: roost-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

  threads:
    virtual:
      enabled: true

  config:
    import: optional:classpath:application-local.yml

logging:
  level:
    org.springframework.cache: TRACE
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        # Never expose everything in prod (env, heapdump, threaddump leak internals).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

server:
  # Honour the platform-injected PORT (Render, Heroku, Cloud Run, …) and fall
  # back to 8080 for local dev and docker-compose.
  port: ${PORT:8080}

roost:
  # Kafka is optional. OFF by default so the app runs on just Postgres + Redis:
  # the outbox relay (OutboxPublisher) then fans out webhooks in-process via
  # DirectOutboxDispatcher. Set true (and point spring.kafka.bootstrap-servers
  # at a broker) to use the full outbox -> Kafka -> consumer pipeline; the
  # docker-compose full-stack run does exactly that.
  kafka:
    enabled: false

  events:
    topic: roost.incidents
    partitions: 3

  probe:
    default-interval-seconds: 60
    default-timeout-millis: 5000

  webhook:
    enabled: true
    timeout-ms: 5000
    max-attempts: 5

  ratelimit:
    login-limit: 5
    login-window-seconds: 60