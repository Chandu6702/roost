spring:
  application:
    name: roost

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://localhost:5433/roost
    username: roost
    password: roost

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  logging:
    level:
      org.hibernate.SQL: DEBUG

server:
  port: 8080

roost:
  probe:
    default-interval-seconds: 60
    default-timeout-millis: 5000
