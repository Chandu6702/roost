spring:
  application:
    name: roost

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://localhost:5433/roost
    username: roost
    password: roost

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6380

  threads:
    virtual:
      enabled: true

  config:
    import: optional:classpath:application-local.yml

logging:
  level:
    org.springframework.cache: TRACE
    org.hibernate.SQL: DEBUG

server:
  port: 8080

roost:
  probe:
    default-interval-seconds: 60
    default-timeout-millis: 5000

  webhook:
    enabled: true
    endpoint-url: https://example.com/webhooks
    timeout-ms: 5000