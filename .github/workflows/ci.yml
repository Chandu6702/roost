name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Backing services the integration tests need. Ports mirror
    # docker-compose.yml (and application.yml): Postgres on 5433, Redis on
    # 6380. Testcontainers supplies Postgres for the tests that use it; the
    # plain @SpringBootTest contexts and the Redis tests connect to these.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roost
          POSTGRES_PASSWORD: roost
          POSTGRES_DB: roost
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U roost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # JDK 25 to match pom <java.version>. Temurin + built-in Maven cache.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -B = batch mode: non-interactive, no download-progress spam in logs.
      # verify runs unit + Testcontainers/embedded-Kafka integration tests;
      # Docker is preinstalled on GitHub-hosted runners.
      - name: Build and test
        env:
          # The app reads ${jwt.secret}; real deployments inject it (docker-compose
          # sets JWT_SECRET, locally it comes from the git-ignored application-local.yml).
          # Tests only need a present, >=32-byte HS256 key — a throwaway is fine.
          JWT_SECRET: ci-test-only-hs256-signing-secret-0123456789-abcdef
        run: ./mvnw -B verify
